name: tzap mutation testing
description: Mutation-test the lines a pull request changes, and annotate the survivors on the diff.
branding:
  icon: check-circle
  color: green

inputs:
  base:
    description: The ref to diff against. Default the pull request's base branch; required on other events.
    required: false
    default: ''
  threshold:
    description: Fail when the mutation score of the changed lines is below this percentage.
    required: false
    default: ''
  working-directory:
    description: The package or workspace root to run in.
    required: false
    default: '.'
  version:
    description: A tzap package spec for npx to run (a version, a tarball path or URL); default the tzap installed in the project.
    required: false
    default: ''
  args:
    description: Extra arguments for `tzap run`.
    required: false
    default: ''

outputs:
  score:
    description: The mutation score of the changed lines.
    value: ${{ steps.tzap.outputs.score }}

runs:
  using: composite
  steps:
    - id: tzap
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TZAP_BASE: ${{ inputs.base || (github.base_ref && format('origin/{0}', github.base_ref)) || '' }}
        TZAP_THRESHOLD: ${{ inputs.threshold }}
        TZAP_VERSION: ${{ inputs.version }}
        TZAP_ARGS: ${{ inputs.args }}
      run: |
        set -o pipefail
        if [ -z "$TZAP_BASE" ]; then
          echo "::error::No base to diff against: this is not a pull request, so set the action's base input."
          exit 2
        fi
        if ! git rev-parse --verify --quiet "$TZAP_BASE^{commit}" > /dev/null; then
          echo "::error::$TZAP_BASE is not in this clone. Check out with fetch-depth: 0."
          exit 2
        fi
        # The project's own tzap, never whatever npm resolves the bare name to.
        if [ -n "$TZAP_VERSION" ]; then
          case "$TZAP_VERSION" in
            *[/:]*|*.tgz) spec="$TZAP_VERSION" ;;
            *) spec="tzap@$TZAP_VERSION" ;;
          esac
        elif [ -x node_modules/.bin/tzap ]; then
          spec=tzap
        else
          echo "::error::tzap is not installed in $(pwd): add it to devDependencies, or set the action's version input."
          exit 2
        fi
        threshold=()
        if [ -n "$TZAP_THRESHOLD" ]; then threshold=(--threshold "$TZAP_THRESHOLD"); fi
        code=0
        npx --yes "$spec" run --from "$TZAP_BASE" --to HEAD -r github,markdown,json -o reports/tzap "${threshold[@]}" $TZAP_ARGS || code=$?
        if [ -f reports/tzap/tzap.md ]; then cat reports/tzap/tzap.md >> "$GITHUB_STEP_SUMMARY"; fi
        if [ -f reports/tzap/tzap.json ]; then
          node -e "const r=require('./reports/tzap/tzap.json'); console.log('score=' + (r.score?.mutationScore ?? ''))" >> "$GITHUB_OUTPUT"
        fi
        exit $code
